services:
  # ──────────────────────────────────────────────
  # Backend — FastAPI Web Service
  # ──────────────────────────────────────────────
  - type: web
    name: schemesaathi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python database/seed.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ──────────────────────────────────────────────
  # Frontend — React/Vite Static Site
  # ──────────────────────────────────────────────
  - type: static
    name: schemesaathi-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://schemesaathi-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
